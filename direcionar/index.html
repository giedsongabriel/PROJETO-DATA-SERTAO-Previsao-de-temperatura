<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFWeather</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f1f1f1;
        }

        .erro {
            background: #ffecec;
            color: #a00000;
        }

        .botao {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🌤️</div>

        <h1>IFWeather</h1>

        <p>Sistema de previsão do tempo</p>

        <div id="status" class="status">
            🔄 Conectando ao servidor...
        </div>

        <div id="botao"></div>
    </div>

    <script>
        async function conectar() {
            const status = document.getElementById("status");
            const botao = document.getElementById("botao");

            try {
                const resposta = await fetch(
                    "endereco.json?t=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!resposta.ok) {
                    throw new Error("Não foi possível obter o endereço.");
                }

                const dados = await resposta.json();

                if (!dados.url) {
                    throw new Error("URL do servidor não encontrada.");
                }

                const url = dados.url;

                if (!/^https:\/\/[a-zA-Z0-9-]+\.trycloudflare\.com\/?$/.test(url)) {
                    throw new Error("URL recebida não é um endereço esperado do Cloudflare Tunnel.");
                }

                status.innerHTML =
                    "✅ Servidor encontrado!<br>Redirecionando...";

                setTimeout(() => {
                    window.location.replace(url);
                }, 500);

            } catch (erro) {
                console.error(erro);

                status.classList.add("erro");
                status.innerHTML =
                    "❌ Servidor temporariamente indisponível.";

                botao.innerHTML = `
                    <a class="botao" href="javascript:location.reload()">
                        🔄 Tentar novamente
                    </a>
                `;
            }
        }

        conectar();
    </script>
</body>
</html>
